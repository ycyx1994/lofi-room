name: Release 构建

on:
  workflow_dispatch:        # 手动出包：Actions 页面点 Run workflow
  push:
    tags: ["v*"]            # 推 v* 标签自动出包并挂到 GitHub Release

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 供应链校验：比对 gradlew / gradle-wrapper.jar 官方已知指纹，防止构建入口被篡改
      - uses: gradle/actions/wrapper-validation@v3

      # tag ↔ versionName 一致性：推 v1.9.3 标签时，构建出的 APK 必须是 versionName 1.9.3。
      # 否则会像 v1.9.2 那样「tag 与版本号不符」→ 站点/更新判定与哈希闸错乱 → 无限更新循环。
      # 仅 tag 构建校验（workflow_dispatch 手动出包无 tag，跳过）。脚本内用 shell 变量取 $GITHUB_REF_NAME，不写内联表达式。
      - name: 校验 tag 与 versionName 一致（tag 构建时）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VN="$(sed -nE 's/^[[:space:]]*versionName[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' app/build.gradle.kts | head -n1)"
          VC="$(sed -nE 's/^[[:space:]]*versionCode[[:space:]]*=[[:space:]]*([0-9]+).*/\1/p' app/build.gradle.kts | head -n1)"
          TAG="$GITHUB_REF_NAME"
          echo "tag=$TAG  versionName=$VN  versionCode=$VC"
          if [ -z "$VN" ] || [ -z "$VC" ]; then
            echo "::error::从 app/build.gradle.kts 解析 versionName/versionCode 失败（versionName 或 versionCode 缺失）"
            exit 1
          fi
          if [ "$TAG" != "v$VN" ]; then
            echo "::error::tag 与 versionName 不一致：tag=$TAG 但 versionName=$VN（应为 v$VN）——中断出包，防版本错乱/无限更新循环"
            exit 1
          fi
          echo "✓ tag $TAG 与 versionName $VN 一致（versionCode $VC）"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: 恢复签名密钥（仓库 Secrets 注入，任何机器出包签名一致）
        # Secrets 一律走 env: 映射 + 环境变量引用，不以内联表达式落进脚本正文（日志/报错不回显明文）
        env:
          LOFIROOM_KEYSTORE_BASE64: ${{ secrets.LOFIROOM_KEYSTORE_BASE64 }}
          LOFIROOM_KEYSTORE_PASSWORD: ${{ secrets.LOFIROOM_KEYSTORE_PASSWORD }}
          LOFIROOM_KEY_PASSWORD: ${{ secrets.LOFIROOM_KEY_PASSWORD }}
        run: |
          mkdir -p keystore
          printf '%s' "$LOFIROOM_KEYSTORE_BASE64" | base64 -d > keystore/lofiroom-release.jks
          # printf 字面写入口令（与原内联表达式等价），避免 heredoc 对含 $/反引号 的口令二次展开
          printf 'storeFile=keystore/lofiroom-release.jks\nstorePassword=%s\nkeyAlias=lofiroom\nkeyPassword=%s\n' \
            "$LOFIROOM_KEYSTORE_PASSWORD" "$LOFIROOM_KEY_PASSWORD" > keystore.properties

      - name: 单元测试（UpdateChecker / UpdateScheduler / ImportGuard 纯逻辑）
        run: ./gradlew :app:testReleaseUnitTest --stacktrace

      - name: 静态检查（lint，release 变体）
        run: ./gradlew :app:lintRelease --stacktrace

      - name: 构建 release 包
        run: ./gradlew :app:assembleRelease

      - name: 校验签名指纹（应为 9F:99:D5:23:66:55:00:FF:D4:86:49:D2:34:8D:86:4D:B2:B1:56:22:B5:1B:9F:D8:73:91:29:47:29:BC:72:69，不匹配即 fail-fast）
        run: |
          EXPECTED="9F:99:D5:23:66:55:00:FF:D4:86:49:D2:34:8D:86:4D:B2:B1:56:22:B5:1B:9F:D8:73:91:29:47:29:BC:72:69"
          ACTUAL="$(keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk | sed -nE 's/.*SHA256:[[:space:]]*//p' | head -n1 | tr -d '[:space:]' | tr 'a-f' 'A-F')"
          echo "APK 签名指纹: $ACTUAL"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::签名指纹不匹配（期望 $EXPECTED，实际 $ACTUAL）——签名密钥/流程被改，中断发布"
            exit 1
          fi

      # 产出 APK 哈希旁文件：sha256sum 行格式（"<hex>  lofiroom-latest.apk"），
      # 与 UpdateChecker.parseSha256 / SHA256_LINE_RE、deploy-site.sh 上传的 lofiroom-latest.apk.sha256 三处约定一致；
      # 下载哈希闸（UpdateChecker.download wantSha）据此校验落地前完整性，发布端不补哈希则该校验恒跳过
      - name: 产出 lofiroom-latest.apk.sha256（哈希闸信任根）
        run: |
          cp app/build/outputs/apk/release/app-release.apk lofiroom-latest.apk
          sha256sum lofiroom-latest.apk | tee lofiroom-latest.apk.sha256

      # 签名材料用完即焚（keystore.properties/keystore 仅构建期需要，后续上传/发布步骤不依赖）
      - name: 清理签名材料（keystore/keystore.properties）
        if: always()
        run: rm -rf keystore keystore.properties

      - uses: actions/upload-artifact@v4
        with:
          name: lofiroom-release
          path: |
            app/build/outputs/apk/release/app-release.apk
            lofiroom-latest.apk.sha256
          retention-days: 90

      - name: 挂到 GitHub Release（仅 v* 标签触发时）
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cp app/build/outputs/apk/release/app-release.apk "lofiroom-${GITHUB_REF_NAME}.apk"
          # 固定名直链 lofiroom-latest.apk（上一步已产出）恒指向最新版，
          # 供 APK 内多源下载优先使用（不依赖 API 限流、少一次 302 跳转）；
          # lofiroom-latest.apk.sha256 一并挂上，GitHub 通道也能喂到哈希闸

      - name: 创建 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            lofiroom-*.apk
            lofiroom-latest.apk.sha256
          generate_release_notes: true
