<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lofi Room · 自定义管理</title>
<style>
  :root {
    --gold: #d8b57e;
    --cream: #f6f0e6;
    --dim: #c8bca9;
    --bg: #120e0b;
    --panel: rgba(18, 14, 11, .92);
    --stroke: rgba(216, 181, 126, .18);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; touch-action: manipulation; }
  body {
    background: var(--bg); color: var(--cream);
    font-family: system-ui, -apple-system, "PingFang SC", "Noto Sans SC", sans-serif;
    min-height: 100vh; padding-bottom: 40px; overflow-x: hidden;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: linear-gradient(rgba(18,14,11,.97), rgba(18,14,11,.88));
    backdrop-filter: blur(8px); padding: 18px 18px 12px;
    border-bottom: 1px solid var(--stroke);
  }
  h1 { font-family: Georgia, "Songti SC", serif; font-size: 20px; letter-spacing: 2px; color: var(--gold); font-weight: 500; }
  .now { margin-top: 6px; font-size: 12px; color: var(--dim); line-height: 1.6; }
  .now b { color: var(--cream); font-weight: 500; }
  nav { display: flex; gap: 10px; margin-top: 12px; }
  nav button {
    flex: 1; padding: 10px 0; border-radius: 12px; border: 1px solid var(--stroke);
    background: transparent; color: var(--dim); font-size: 14px; letter-spacing: 1px;
    font-weight: 500; line-height: 1.3;
    /* 只过渡颜色类属性：字重/布局不参与过渡，杜绝切换 tab 时「·」标签上下抽动 */
    transition: background-color .18s, color .18s, border-color .18s;
  }
  nav button.on { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  nav button .ic { display: none; } /* 竖屏 tab 保持纯文字；横屏侧栏才显示图标 */
  #rail-btn { display: none; }      /* 侧栏折叠开关仅横屏可见 */
  main { padding: 16px 16px 0; }
  section { display: none; }
  section.on { display: block; }
  .bar { display: flex; gap: 10px; margin-bottom: 14px; }
  .bar label {
    flex: 1; padding: 13px 0; border-radius: 14px;
    background: rgba(216,181,126,.12); color: var(--gold); font-size: 14px; letter-spacing: 1px;
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .bar label input { display: none; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .cell {
    position: relative; border-radius: 14px; overflow: hidden; aspect-ratio: 16/9;
    border: 2px solid transparent; background: #1a1510; transition: border-color .15s;
  }
  .cell img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .cell.applied { border-color: var(--gold); }
  .cell .tag {
    position: absolute; top: 6px; left: 6px; padding: 2px 8px; border-radius: 8px;
    font-size: 10px; background: var(--gold); color: var(--bg); font-weight: 600;
  }
  .cell { -webkit-touch-callout: none; -webkit-user-select: none; user-select: none; }
  .cell .del {
    position: absolute; top: 6px; right: 6px; width: 26px; height: 26px; border-radius: 50%;
    background: rgba(0,0,0,.55); color: var(--cream); border: 1px solid rgba(255,255,255,.25);
    display: flex; align-items: center; justify-content: center;
  }
  .track {
    display: flex; align-items: center; gap: 12px; padding: 13px 14px; margin-bottom: 10px;
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 14px;
  }
  .track.playing { border-color: var(--gold); }
  .track .no { font-family: Georgia, serif; color: var(--gold); font-size: 15px; width: 26px; flex-shrink: 0; }
  .track .meta { flex: 1; min-width: 0; }
  .track .meta .t { font-family: Georgia, "Songti SC", serif; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .meta .s { font-size: 11px; color: var(--dim); margin-top: 3px; letter-spacing: .5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .track .ops { display: flex; gap: 8px; flex-shrink: 0; }
  .track .ops button {
    border: 1px solid var(--stroke); background: transparent; color: var(--dim);
    border-radius: 10px; padding: 7px 11px; font-size: 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px;
  }
  .track .ops button:active { background: var(--gold); color: var(--bg); }
  .empty { text-align: center; color: var(--dim); font-size: 13px; padding: 30px 0; letter-spacing: 1px; }
  .seg-row button:active { background: rgba(216,181,126,.12); color: var(--gold); }
  /* ── 右上角「···」二级菜单（备份操作收纳）── */
  .hrow { position: relative; display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .more-btn {
    width: 38px; height: 38px; border-radius: 12px; flex-shrink: 0;
    border: 1px solid var(--stroke); background: transparent; color: var(--dim);
    display: flex; align-items: center; justify-content: center; font-size: 16px;
    transition: background-color .18s, color .18s, border-color .18s;
  }
  .more-btn.on { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  /* 「···」按钮与二级菜单 DOM 挂在 nav 内；竖屏绝对定位回标题栏右上（与旧版视觉一致） */
  #more-btn { position: absolute; top: 18px; right: 18px; }
  #more-btn .ic { display: block; }
  .more-menu {
    position: absolute; top: 66px; right: 18px; z-index: 30;
    width: min(300px, calc(100vw - 32px));
    background: var(--panel); border: 1px solid var(--stroke); border-radius: 14px;
    padding: 8px; display: none; box-shadow: 0 12px 32px rgba(0,0,0,.45);
  }
  .more-menu.on { display: block; }
  .more-menu button {
    width: 100%; display: flex; align-items: center; gap: 8px;
    padding: 11px 12px; border-radius: 10px; border: 0; background: transparent;
    color: var(--cream); font-size: 13px; letter-spacing: .5px; text-align: left;
  }
  .more-menu button:active { background: var(--gold); color: var(--bg); }
  .more-note {
    font-size: 10.5px; color: var(--dim); opacity: .75; line-height: 1.7;
    padding: 8px 10px 2px; border-top: 1px solid var(--stroke); margin-top: 6px;
  }
  .seg-row { display: flex; gap: 8px; margin: 2px 0 10px; }
  .seg-row button {
    flex: 1; padding: 10px 0; border-radius: 10px; font-size: 13px;
    font-weight: 500; line-height: 1.3;
    border: 1px solid var(--stroke); background: transparent; color: var(--dim);
    transition: background-color .18s, color .18s, border-color .18s;
  }
  .seg-row button.on { background: var(--gold); color: var(--bg); border-color: var(--gold); }
  .imp-file {
    font-size: 12px; color: var(--cream); background: rgba(255,255,255,.06);
    border: 1px solid var(--stroke); border-radius: 10px; padding: 10px 12px;
    margin-bottom: 12px; word-break: break-all;
  }
  .imp-note { font-size: 11.5px; color: var(--dim); line-height: 1.75; margin: 2px 2px 4px; }
  #progress {
    position: fixed; left: 16px; right: 16px; bottom: 20px; display: none;
    background: var(--panel); border: 1px solid var(--gold); border-radius: 14px; padding: 14px 16px; z-index: 20;
  }
  #progress .pt { font-size: 13px; color: var(--gold); margin-bottom: 8px; }
  #progress .track2 { height: 6px; border-radius: 3px; background: rgba(216,181,126,.18); overflow: hidden; }
  #progress .fill { height: 100%; width: 0; background: var(--gold); border-radius: 3px; transition: width .12s; }
  #toast {
    position: fixed; left: 50%; top: 24px; transform: translateX(-50%) translateY(-16px);
    background: var(--gold); color: var(--bg); padding: 11px 22px; border-radius: 12px;
    font-size: 13px; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  #toast.err { background: #c0553e; color: var(--cream); }

  /* ── 弹窗遮罩（裁剪编辑 / 曲目编辑共用）── */
  .mask {
    position: fixed; inset: 0; z-index: 40; display: none;
    background: rgba(8, 6, 4, .86); backdrop-filter: blur(6px);
    align-items: flex-start; justify-content: center; padding: 16px;
    overflow-y: auto; /* 平板/横屏放不下时弹窗可滚动，不截断 */
  }
  .mask.on { display: flex; }
  .sheet { width: min(520px, 100%); margin: auto; }

  /* ── 16:9 裁剪编辑 ── */
  .crop-title { font-size: 12px; color: var(--dim); text-align: center; letter-spacing: 1px; margin-bottom: 10px; line-height: 1.7; }
  .crop-area {
    position: relative; overflow: hidden; border-radius: 16px;
    width: 100%; aspect-ratio: 4/3; background: #0a0806;
    border: 1px solid var(--stroke); touch-action: none;
  }
  .crop-area img {
    position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none;
    user-select: none; -webkit-user-select: none; -webkit-user-drag: none;
  }
  .crop-frame {
    position: absolute; left: 12px; right: 12px; top: 50%; transform: translateY(-50%);
    aspect-ratio: 16/9; border: 1.5px solid var(--gold); border-radius: 8px;
    box-shadow: 0 0 0 9999px rgba(0, 0, 0, .55); pointer-events: none;
  }
  .zoomrow { display: flex; align-items: center; gap: 10px; margin: 12px 2px 2px; }
  .zoomrow span { font-size: 12px; color: var(--dim); flex-shrink: 0; }
  .zoomrow input { flex: 1; accent-color: var(--gold); }

  /* ── 通用弹窗按钮 / 曲目编辑 ── */
  .btns { display: flex; gap: 10px; margin-top: 14px; }
  .btns button {
    flex: 1; padding: 12px 0; border-radius: 12px; font-size: 14px; letter-spacing: 1px;
    border: 1px solid var(--stroke); background: transparent; color: var(--dim);
  }
  .btns button.gold { background: var(--gold); color: var(--bg); border-color: var(--gold); font-weight: 600; }
  .modal {
    width: min(420px, 100%); background: var(--panel);
    border: 1px solid var(--stroke); border-radius: 18px; padding: 20px 18px;
    margin: auto;
  }
  .modal h2 { font-family: Georgia, "Songti SC", serif; font-size: 16px; color: var(--gold); font-weight: 500; letter-spacing: 1px; margin-bottom: 14px; }
  .modal input {
    width: 100%; min-width: 0; background: rgba(255,255,255,.07); border: 1px solid var(--stroke);
    color: var(--cream); border-radius: 10px; padding: 11px 12px; font-size: 13px; margin-bottom: 10px;
  }

  /* ── 图标（内联 SVG sprite，Lucide 风格：24×24、2px 圆头描边）── */
  .ic {
    width: 1em; height: 1em; flex-shrink: 0;
    stroke: currentColor; fill: none; stroke-width: 2;
    stroke-linecap: round; stroke-linejoin: round;
    vertical-align: -0.14em;
  }

  /* ── 平板 / 宽屏适配 ─────────────────────────────── */
  /* 宽度驱动：列数/弹窗宽度——任何高度都受益 */
  @media (min-width: 700px) {
    .grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
    #track-list { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .track { margin-bottom: 0; }
    .sheet { width: min(680px, 100%); }
    .modal { width: min(500px, 100%); }
    #progress { max-width: 620px; margin: 0 auto; }
  }
  /* 宽+高驱动：放大字号/留白——只给真平板，手机横屏高度不足时回落基线尺寸 */
  @media (min-width: 700px) and (min-height: 700px) {
    header { padding: 26px 30px 18px; }
    h1 { font-size: 25px; }
    .now { font-size: 13.5px; margin-top: 8px; }
    nav { gap: 14px; margin-top: 16px; }
    nav button { font-size: 15px; padding: 12px 0; }
    main { padding: 24px 30px 0; }
    .more-btn { width: 42px; height: 42px; font-size: 18px; }
    .bar label { padding: 15px 0; font-size: 15px; }
    .track { padding: 15px 16px; }
    .empty { padding: 48px 0; font-size: 14px; }
    #more-btn { top: 26px; right: 30px; }
    #more-menu { top: 78px; right: 30px; }
  }
  @media (min-width: 1100px) {
    /* 超宽屏（大平板横屏/桌面）：内容封顶居中，网格再加一列 */
    header > *, main > * { max-width: 1080px; margin-left: auto; margin-right: auto; }
    .grid { grid-template-columns: repeat(5, 1fr); }
  }
  /* ── 横屏：左侧可伸缩竖向菜单栏 + 右侧操作区 ── */
  @media (orientation: landscape) and (min-width: 560px) {
    body { --sbw: 210px; }
    body.rail { --sbw: 64px; }
    header {
      backdrop-filter: none; /* 关键：backdrop-filter 会给 fixed 后代形成包含块，侧栏必须脱离 header 锚定 */
      margin-left: calc(var(--sbw) + 24px);
      display: flex; align-items: center; gap: 8px 20px; flex-wrap: wrap;
      padding: 12px 24px 10px; /* 标题模块收紧：单行「左标题 / 右状态」 */
      transition: margin-left .22s;
    }
    .hrow { margin: 0; }
    .now { margin: 0 0 0 auto; text-align: right; line-height: 1.45; } /* 状态并入标题行右端，省纵向高度 */
    main { margin-left: calc(var(--sbw) + 24px); transition: margin-left .22s; }
    #progress { left: calc(var(--sbw) + 24px); }
    nav {
      position: fixed; left: 12px; top: 12px; bottom: 12px; z-index: 15;
      width: var(--sbw); margin: 0; padding: 12px;
      flex-direction: column; gap: 10px;
      background: var(--panel); border: 1px solid var(--stroke); border-radius: 18px;
      transition: width .22s;
    }
    nav button {
      flex: none; width: 100%; display: flex; align-items: center;
      justify-content: flex-start; gap: 10px; padding: 12px 14px;
    }
    nav button .ic { display: block; }
    nav button span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    #more-btn { position: static; width: 100%; margin-top: auto; justify-content: center; padding: 10px 0; }
    #rail-btn { display: flex; justify-content: center; padding: 10px 0; }
    #more-menu { top: auto; bottom: 62px; left: calc(100% + 12px); right: auto; }
    /* 收起态：64px 图标轨 */
    body.rail nav button { justify-content: center; padding: 12px 0; }
    body.rail nav button span { display: none; }
  }
  /* 短视口（手机横屏）：弹窗/裁剪紧凑，保证同屏可用 */
  @media (max-height: 520px) {
    .crop-area { width: min(100%, max(240px, calc((100vh - 250px) * 4 / 3))); margin-left: auto; margin-right: auto; }
    .crop-title { margin-bottom: 8px; }
    .zoomrow { margin: 8px 2px 2px; }
    .btns { margin-top: 10px; }
    .btns button { padding: 9px 0; font-size: 13px; }
    .modal { padding: 16px 14px; }
    .modal h2 { margin-bottom: 10px; }
    .modal input { padding: 9px 11px; margin-bottom: 8px; }
  }
</style>
</head>
<body>
<!-- 图标 sprite：Lucide 风格统一图标库（内联离线可用） -->
<svg style="display:none" aria-hidden="true">
  <symbol id="i-download" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></symbol>
  <symbol id="i-upload" viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" x2="12" y1="3" y2="15"/></symbol>
  <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></symbol>
  <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></symbol>
  <symbol id="i-play" viewBox="0 0 24 24"><polygon points="6 3 20 12 6 21 6 3"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z"/><path d="m15 5 4 4"/></symbol>
  <symbol id="i-trash" viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></symbol>
  <symbol id="i-arrow-up" viewBox="0 0 24 24"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></symbol>
  <symbol id="i-arrow-down" viewBox="0 0 24 24"><path d="M12 5v14"/><path d="m19 12-7 7-7-7"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></symbol>
  <symbol id="i-more" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.7" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1.7" fill="currentColor" stroke="none"/></symbol>
  <symbol id="i-panel" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="9" y1="3" x2="9" y2="21"/></symbol>
</svg>
<header>
  <div class="hrow">
    <h1>LOFI ROOM · 自定义管理</h1>
  </div>
  <div class="now" id="now">正在连接电视…</div>
  <nav>
    <button id="tab-wall" class="on" onclick="switchTab('wall')"><svg class="ic"><use href="#i-image"/></svg><span>背景</span></button>
    <button id="tab-music" onclick="switchTab('music')"><svg class="ic"><use href="#i-music"/></svg><span>音乐</span></button>
    <button id="more-btn" class="more-btn" onclick="toggleMore(event)" aria-label="更多：备份操作"><svg class="ic"><use href="#i-more"/></svg></button>
    <!-- 备份操作二级菜单 -->
    <div id="more-menu" class="more-menu">
      <button onclick="location.href='api/export?part=all'"><svg class="ic"><use href="#i-download"/></svg>导出全部备份</button>
      <button onclick="location.href='api/export?part=wall'"><svg class="ic"><use href="#i-download"/></svg>只导照片包</button>
      <button onclick="location.href='api/export?part=music'"><svg class="ic"><use href="#i-download"/></svg>只导音乐包</button>
      <button onclick="$('#imp-file').click()"><svg class="ic"><use href="#i-upload"/></svg>导入恢复</button>
      <div class="more-note">备份 zip 保存到手机「下载」；照片/音乐可分包导出、分批合并导入，整包恢复用「覆盖恢复」</div>
    </div>
    <button id="rail-btn" onclick="toggleRail()" aria-label="收起/展开菜单栏"><svg class="ic"><use href="#i-panel"/></svg></button>
  </nav>
</header>

<main>
  <input type="file" id="imp-file" accept=".zip,application/zip" style="display:none">
  <section id="sec-wall" class="on">
    <div class="bar">
      <label><svg class="ic"><use href="#i-image"/></svg>上传照片<input type="file" id="wall-file" accept="image/jpeg,image/png,image/webp"></label>
    </div>
    <div class="grid" id="wall-grid"></div>
    <div class="empty" id="wall-empty" style="display:none">还没有背景，点上方上传</div>
  </section>

  <section id="sec-music">
    <div class="bar">
      <label><svg class="ic"><use href="#i-music"/></svg>上传音频<input type="file" id="track-file" accept="audio/*,.mp3,.m4a,.wav,.aac,.flac,.ogg"></label>
    </div>
    <div id="track-list"></div>
    <div class="empty" id="track-empty" style="display:none">还没有曲目，点上方上传</div>
  </section>
</main>

<div id="progress"><div class="pt" id="progress-text">上传中…</div><div class="track2"><div class="fill" id="progress-fill"></div></div></div>
<div id="toast"></div>

<!-- 背景裁剪编辑：选图后弹出，默认 16:9 居中框选 -->
<div id="crop" class="mask">
  <div class="sheet">
    <div class="crop-title">拖动调整位置 · 双指或滑杆缩放<br>框内即最终 16:9 背景</div>
    <div class="crop-area" id="crop-area">
      <img id="crop-img" alt="">
      <div class="crop-frame" id="crop-frame"></div>
    </div>
    <div class="zoomrow"><span>缩放</span><input type="range" id="crop-zoom" min="100" max="400" value="100"></div>
    <div class="btns">
      <button id="crop-cancel">取消</button>
      <button id="crop-reset">重置</button>
      <button class="gold" id="crop-ok">使用并上传</button>
    </div>
  </div>
</div>

<!-- 曲目编辑弹窗（替代行内展开，避免页面横向溢出） -->
<div id="edit" class="mask">
  <div class="modal">
    <h2>编辑曲目</h2>
    <input id="edit-title" placeholder="标题">
    <input id="edit-sub" placeholder="副标题（曲风 · 作者）">
    <div class="btns">
      <button id="edit-cancel">取消</button>
      <button class="gold" id="edit-save">保存</button>
    </div>
  </div>
</div>

<!-- 删除自定义背景确认弹窗（×按钮与长按共用） -->
<div id="delwall" class="mask" onclick="if(event.target===this)closeDelWall()">
  <div class="modal">
    <h2>删除这张自定义背景？</h2>
    <div class="imp-note">删除后可在「背景」页重新上传，TV 端即时生效</div>
    <div class="btns">
      <button id="delwall-cancel">取消</button>
      <button class="gold" id="delwall-ok">删除</button>
    </div>
  </div>
</div>

<!-- 备份导入确认弹窗：选恢复模式后再上传 -->
<div id="import" class="mask">
  <div class="modal">
    <h2>导入备份</h2>
    <div class="imp-file" id="imp-info"></div>
    <div class="seg-row">
      <button id="imp-mode-replace" class="on">覆盖恢复</button>
      <button id="imp-mode-merge">合并导入</button>
    </div>
    <div class="imp-note" id="imp-note"></div>
    <div class="btns">
      <button id="imp-cancel">取消</button>
      <button class="gold" id="imp-start">开始导入</button>
    </div>
  </div>
</div>

<script>
const $ = s => document.querySelector(s);
let state = {}, wallpapers = [], tracks = [];

// 禁用双击缩放：touch-action: manipulation 为主；此为老 iOS WebView（不支持 touch-action）兜底
let _lastTouchEnd = 0;
document.addEventListener('touchend', e => {
  const now = Date.now();
  if (now - _lastTouchEnd < 300) e.preventDefault();
  _lastTouchEnd = now;
}, { passive: false });

function toast(msg, err) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'show' + (err ? ' err' : '');
  clearTimeout(t._h);
  t._h = setTimeout(() => t.className = '', 2400);
}

function switchTab(tab) {
  $('#tab-wall').classList.toggle('on', tab === 'wall');
  $('#tab-music').classList.toggle('on', tab === 'music');
  $('#sec-wall').classList.toggle('on', tab === 'wall');
  $('#sec-music').classList.toggle('on', tab === 'music');
}

function toggleMore(e) {
  if (e) e.stopPropagation();
  const on = $('#more-menu').classList.toggle('on');
  $('#more-btn').classList.toggle('on', on);
}

function closeMore() {
  $('#more-menu').classList.remove('on');
  $('#more-btn').classList.remove('on');
}

// 点菜单外任意处关闭二级菜单（菜单项自身的 onclick 先执行，再冒泡到此关闭）
document.addEventListener('click', e => {
  if (!e.target.closest('#more-btn')) closeMore();
});

function toggleRail() {
  const collapsed = document.body.classList.toggle('rail');
  try { localStorage.setItem('lofi-rail', collapsed ? '1' : '0'); } catch (e) {}
}

// 恢复侧栏展开/收起偏好（只影响横屏布局，竖屏无感）
try { if (localStorage.getItem('lofi-rail') === '1') document.body.classList.add('rail'); } catch (e) {}

async function api(path, opts) {
  // 15s 超时：电视端无响应时快速失败（AbortController 在老 WebView 缺失时退化为旧行为）
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), 15000) : null;
  try {
    const r = await fetch(path, ctl ? { ...(opts || {}), signal: ctl.signal } : opts);
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || ('HTTP ' + r.status));
    return j;
  } catch (e) {
    if (ctl && e && e.name === 'AbortError') throw new Error('网络超时');
    throw e;
  } finally {
    if (timer) clearTimeout(timer);
  }
}

function xhrUpload(url, file, fields, onDone, label) {
  // #24 文本参数（filename/title/sub）走 URL query：NanoHTTPD 解 multipart 文本字段用 US-ASCII，中文会烂成 '?'
  const q = new URLSearchParams();
  q.set('filename', file.name);
  for (const k in fields) q.set(k, fields[k]);
  const x = new XMLHttpRequest();
  x.open('POST', url + '?' + q.toString());
  x.timeout = 120000; // 上传 120s 超时
  x.upload.onprogress = e => {
    if (e.lengthComputable) $('#progress-fill').style.width = (e.loaded / e.total * 100).toFixed(1) + '%';
  };
  x.onload = () => {
    $('#progress').style.display = 'none';
    try {
      const j = JSON.parse(x.responseText);
      if (x.status >= 400) throw new Error(j.error || ('HTTP ' + x.status));
      onDone(j);
    } catch (e) { toast(e.message, true); }
  };
  // 超时/网络错误/中止统一收起进度条并提示，避免失败后进度条悬挂
  const fail = () => { $('#progress').style.display = 'none'; toast('网络超时', true); };
  x.ontimeout = fail;
  x.onerror = fail;
  x.onabort = fail;
  const fd = new FormData();
  fd.append('file', file, file.name); // 只带二进制，文本字段在 query（见上）
  $('#progress-text').textContent = (label || '上传 ') + file.name;
  $('#progress-fill').style.width = '0';
  $('#progress').style.display = 'block';
  x.send(fd);
}

function renderNow() {
  $('#now').innerHTML =
    (state.playing ? '正在播放 <b>' + esc(state.trackTitle) + '</b>' : '已暂停 · <b>' + esc(state.trackTitle) + '</b>') +
    '<br>当前背景 #' + (+state.wallpaperIndex + 1) + ' · 共 ' + tracks.length + ' 首曲目';
}

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function renderWalls() {
  const g = $('#wall-grid');
  g.innerHTML = wallpapers.map(w => `
    <div class="cell ${w.id === state.wallpaperIndex ? 'applied' : ''}" onclick="applyWall(${+w.id})" data-id="${+w.id}" ${!w.builtin ? 'data-custom="1"' : ''}>
      <img src="api/thumbs/wall/${+w.id}?v=${encodeURIComponent(w.key || +w.id)}" loading="lazy">
      ${w.id === state.wallpaperIndex ? '<div class="tag">当前</div>' : ''}
      ${!w.builtin ? `<div class="del" onclick="event.stopPropagation();openDelWall(${+w.id})"><svg class="ic"><use href="#i-x"/></svg></div>` : ''}
    </div>`).join('');
  $('#wall-empty').style.display = wallpapers.length ? 'none' : 'block';
}

function renderTracks() {
  const l = $('#track-list');
  l.innerHTML = tracks.map((t, i) => `
    <div class="track ${i === state.trackIndex ? 'playing' : ''}">
      <div class="no">${String(i + 1).padStart(2, '0')}</div>
      <div class="meta" onclick="playTrack(${+t.id})">
        <div class="t">${esc(t.title)}</div>
        <div class="s">${esc(t.sub)}${i === state.trackIndex ? ' · PLAYING' : ''}</div>
      </div>
      <div class="ops">
        ${!t.builtin ? `
          <button onclick="moveTrack(${+t.id},-1)"><svg class="ic"><use href="#i-arrow-up"/></svg></button>
          <button onclick="moveTrack(${+t.id},1)"><svg class="ic"><use href="#i-arrow-down"/></svg></button>
          <button onclick="openEdit(${+t.id})"><svg class="ic"><use href="#i-pencil"/></svg>编辑</button>
          <button onclick="delTrack(${+t.id})"><svg class="ic"><use href="#i-trash"/></svg>删</button>` : `<button onclick="playTrack(${+t.id})"><svg class="ic"><use href="#i-play"/></svg>播放</button>`}
      </div>
    </div>`).join('');
  $('#track-empty').style.display = tracks.length ? 'none' : 'block';
}

// 并发守卫：refreshing=refresh() 在途计数（轮询避开）、polling=轮询在途、lastStateJson=state 去重指纹
let refreshing = 0, polling = false, lastStateJson = '';

async function refresh() {
  refreshing++;
  try {
    const [s, w, t] = await Promise.all([
      api('api/state'), api('api/wallpapers'), api('api/tracks'),
    ]);
    state = s; wallpapers = w.wallpapers; tracks = t.tracks;
    lastStateJson = JSON.stringify(s);
    renderNow(); renderWalls(); renderTracks();
  } catch (e) {
    $('#now').textContent = '连接失败：' + e.message;
  } finally {
    refreshing--;
  }
}

async function applyWall(id) {
  try { await api('api/wallpapers/' + id + '/apply', { method: 'POST' }); toast('背景已应用'); refresh(); }
  catch (e) { toast(e.message, true); }
}

// ── 删除自定义背景：×按钮与长按共用二次确认弹窗 ──────────
let delWallId = null;

function openDelWall(id) {
  delWallId = id;
  $('#delwall').classList.add('on');
}

function closeDelWall() {
  delWallId = null;
  $('#delwall').classList.remove('on');
}

async function delWall() {
  if (delWallId == null) return;
  const id = delWallId;
  closeDelWall();
  try { await api('api/wallpapers/' + id, { method: 'DELETE' }); toast('已删除'); refresh(); }
  catch (e) { toast(e.message, true); }
}

$('#delwall-cancel').onclick = closeDelWall;
$('#delwall-ok').onclick = delWall;

// 长按（触摸/鼠标 500ms）自定义背景格 → 同一确认弹窗；
// 长按后吞掉随后的合成 click，防止松手误触发「应用背景」
(function () {
  const grid = $('#wall-grid');
  let lpTimer = null, lpFired = false;
  const lpStart = (e) => {
    const cell = e.target.closest && e.target.closest('.cell[data-custom]');
    if (!cell) return;
    lpFired = false;
    clearTimeout(lpTimer);
    lpTimer = setTimeout(() => { lpFired = true; openDelWall(+cell.dataset.id); }, 500);
  };
  const lpCancel = () => { clearTimeout(lpTimer); lpTimer = null; };
  grid.addEventListener('touchstart', lpStart, { passive: true });
  grid.addEventListener('touchmove', lpCancel, { passive: true });
  grid.addEventListener('touchend', lpCancel);
  grid.addEventListener('mousedown', lpStart);
  grid.addEventListener('mouseup', lpCancel);
  grid.addEventListener('mouseleave', lpCancel);
  grid.addEventListener('contextmenu', (e) => e.preventDefault());
  document.addEventListener('click', (e) => {
    if (lpFired) { e.stopPropagation(); e.preventDefault(); lpFired = false; }
  }, true);
})();

async function playTrack(id) {
  try { await api('api/tracks/' + id + '/play', { method: 'POST' }); toast('开始播放'); refresh(); }
  catch (e) { toast(e.message, true); }
}

async function moveTrack(id, dir) {
  try { await api('api/tracks/' + id + '/move?dir=' + dir, { method: 'POST' }); refresh(); }
  catch (e) { toast(e.message, true); }
}

async function delTrack(id) {
  if (!confirm('删除这首自定义曲目？')) return;
  try { await api('api/tracks/' + id, { method: 'DELETE' }); toast('已删除'); refresh(); }
  catch (e) { toast(e.message, true); }
}

// ── 曲目编辑弹窗 ────────────────────────────────────────

let editId = null;

function openEdit(id) {
  const t = tracks.find(x => x.id === id);
  if (!t) return;
  editId = id;
  $('#edit-title').value = t.title;
  $('#edit-sub').value = t.sub;
  $('#edit').classList.add('on');
}

function closeEdit() {
  $('#edit').classList.remove('on');
  editId = null;
}

$('#edit-cancel').addEventListener('click', closeEdit);

$('#edit-save').addEventListener('click', async () => {
  if (editId == null) return;
  const title = $('#edit-title').value.trim();
  const sub = $('#edit-sub').value.trim();
  try {
    await api('api/tracks/' + editId + '?title=' + encodeURIComponent(title) + '&sub=' + encodeURIComponent(sub), { method: 'PATCH' });
    toast('已保存'); closeEdit(); refresh();
  } catch (e) { toast(e.message, true); }
});

// ── 备份导入（覆盖恢复 / 合并导入）──────────────────────

let impFile = null, impMode = 'replace';

function setImpMode(m) {
  impMode = m;
  $('#imp-mode-replace').classList.toggle('on', m === 'replace');
  $('#imp-mode-merge').classList.toggle('on', m === 'merge');
  $('#imp-note').textContent = m === 'replace'
    ? '替换电视上全部现有照片与音乐（旧数据在电视上保留为 custom.bak）。适合整包恢复。'
    : '保留电视上现有内容，把 zip 里的照片/音乐追加进来。适合照片包、音乐包分批导入。';
}

function openImport(file) {
  impFile = file;
  $('#imp-info').textContent = file.name + '（' + (file.size / 1048576).toFixed(1) + ' MB）';
  setImpMode('replace');
  $('#import').classList.add('on');
}

function closeImport() {
  $('#import').classList.remove('on');
  impFile = null;
}

$('#imp-mode-replace').addEventListener('click', () => setImpMode('replace'));
$('#imp-mode-merge').addEventListener('click', () => setImpMode('merge'));
$('#imp-cancel').addEventListener('click', closeImport);

$('#imp-start').addEventListener('click', () => {
  if (!impFile) return;
  const f = impFile, mode = impMode;
  closeImport();
  xhrUpload('api/import?mode=' + mode, f, {}, j => {
    toast('导入完成：照片 ' + j.walls + ' 张 · 音乐 ' + j.tracks + ' 首');
    refresh();
  }, '导入 ');
});

$('#imp-file').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > 512 * 1024 * 1024) { toast('备份包超过 512MB 限制，已取消导入', true); return; } // 与服务端限额一致，先拦后传
  openImport(f);
});

// ── 背景 16:9 裁剪编辑 ──────────────────────────────────
// 框选窗固定 16:9 居中；图片在其后拖动/缩放，框内即上传内容。
// 坐标系：img 以 transform-origin 0 0 平移 (x,y) 后缩放 z；
// z=1 时图片显示宽 bw = naturalWidth * coverScale，恰好覆盖框。

let cropFile = null, cropUrl = null;
let cS = 1, cZ = 1, cPX = 0, cPY = 0;      // coverScale(px/自然px)、缩放、平移
let rectF = null, rectA = null;            // 框 / 裁剪区（相对裁剪区左上）

function openCrop(file) {
  cropFile = file;
  if (cropUrl) URL.revokeObjectURL(cropUrl);
  cropUrl = URL.createObjectURL(file);
  const img = $('#crop-img');
  img.onload = () => {
    if (!img.naturalWidth) { toast('图片无法解析', true); return; }
    $('#crop').classList.add('on');
    requestAnimationFrame(() => { layoutCrop(); resetCrop(); });
  };
  img.onerror = () => toast('图片无法解析', true);
  img.src = cropUrl;
}

function closeCrop() {
  $('#crop').classList.remove('on');
}

function layoutCrop() {
  const a = $('#crop-area').getBoundingClientRect();
  const f = $('#crop-frame').getBoundingClientRect();
  rectA = a;
  rectF = { x: f.left - a.left, y: f.top - a.top, w: f.width, h: f.height };
  const img = $('#crop-img');
  cS = Math.max(rectF.w / img.naturalWidth, rectF.h / img.naturalHeight);
}

function applyCrop() {
  const img = $('#crop-img');
  const bw = img.naturalWidth * cS, bh = img.naturalHeight * cS;
  const x = rectF.x + rectF.w / 2 - bw * cZ / 2 + cPX;
  const y = rectF.y + rectF.h / 2 - bh * cZ / 2 + cPY;
  img.style.width = bw + 'px';
  img.style.height = bh + 'px';
  img.style.transform = `translate(${x}px, ${y}px) scale(${cZ})`;
}

function clampCrop() {
  const img = $('#crop-img');
  const mw = img.naturalWidth * cS * cZ, mh = img.naturalHeight * cS * cZ;
  const mx = Math.max(0, mw / 2 - rectF.w / 2);
  const my = Math.max(0, mh / 2 - rectF.h / 2);
  cPX = Math.min(mx, Math.max(-mx, cPX));
  cPY = Math.min(my, Math.max(-my, cPY));
}

/** 以裁剪区坐标 (ax,ay) 为锚点缩放（滑杆锚框中心，双指锚捏合中点） */
function setCropZoom(z2, ax, ay) {
  z2 = Math.min(4, Math.max(1, z2));
  const img = $('#crop-img');
  const bw = img.naturalWidth * cS, bh = img.naturalHeight * cS;
  const x1 = rectF.x + rectF.w / 2 - bw * cZ / 2 + cPX;
  const y1 = rectF.y + rectF.h / 2 - bh * cZ / 2 + cPY;
  cPX = ax - (ax - x1) / cZ * z2 - (rectF.x + rectF.w / 2 - bw * z2 / 2);
  cPY = ay - (ay - y1) / cZ * z2 - (rectF.y + rectF.h / 2 - bh * z2 / 2);
  cZ = z2;
  clampCrop(); applyCrop();
  $('#crop-zoom').value = Math.round(cZ * 100);
}

function resetCrop() {
  cZ = 1; cPX = 0; cPY = 0;
  clampCrop(); applyCrop();
  $('#crop-zoom').value = 100;
}

// 拖动平移 + 双指捏合缩放（Pointer Events）
const cropPts = new Map();
let pinchBase = null;

function pinchInfo() {
  const [p1, p2] = [...cropPts.values()];
  return {
    dist: Math.hypot(p1.x - p2.x, p1.y - p2.y) || 1,
    mid: [(p1.x + p2.x) / 2, (p1.y + p2.y) / 2],
    z: cZ,
  };
}

const cropArea = $('#crop-area');
cropArea.addEventListener('pointerdown', e => {
  cropArea.setPointerCapture(e.pointerId);
  cropPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (cropPts.size === 2) pinchBase = pinchInfo();
});
cropArea.addEventListener('pointermove', e => {
  if (!cropPts.has(e.pointerId)) return;
  const prev = cropPts.get(e.pointerId);
  const cur = { x: e.clientX, y: e.clientY };
  cropPts.set(e.pointerId, cur);
  if (cropPts.size === 1) {
    cPX += cur.x - prev.x;
    cPY += cur.y - prev.y;
    clampCrop(); applyCrop();
  } else if (cropPts.size === 2 && pinchBase) {
    const p = pinchInfo();
    setCropZoom(pinchBase.z * (p.dist / pinchBase.dist), p.mid[0] - rectA.left, p.mid[1] - rectA.top);
  }
});
['pointerup', 'pointercancel'].forEach(t => cropArea.addEventListener(t, e => {
  cropPts.delete(e.pointerId);
  pinchBase = cropPts.size === 2 ? pinchInfo() : null;
}));

$('#crop-zoom').addEventListener('input', e => {
  setCropZoom(e.target.value / 100, rectF.x + rectF.w / 2, rectF.y + rectF.h / 2);
});

$('#crop-cancel').addEventListener('click', closeCrop);
$('#crop-reset').addEventListener('click', resetCrop);

$('#crop-ok').addEventListener('click', () => {
  const img = $('#crop-img');
  const s = cS * cZ;                                   // 自然像素 → CSS px
  const bw = img.naturalWidth * cS, bh = img.naturalHeight * cS;
  const x = rectF.x + rectF.w / 2 - bw * cZ / 2 + cPX;
  const y = rectF.y + rectF.h / 2 - bh * cZ / 2 + cPY;
  const sx = Math.max(0, (rectF.x - x) / s);
  const sy = Math.max(0, (rectF.y - y) / s);
  const sw = rectF.w / s, sh = rectF.h / s;
  // 输出：以框内自然分辨率为准，上限 2560 宽，严格 16:9
  const outW = Math.max(16, Math.min(2560, Math.round(sw)));
  const outH = Math.round(outW * 9 / 16);
  const cv = document.createElement('canvas');
  cv.width = outW; cv.height = outH;
  cv.getContext('2d').drawImage(img, sx, sy, sw, sh, 0, 0, outW, outH);
  cv.toBlob(blob => {
    if (!blob) { toast('裁剪失败', true); return; }
    const name = (cropFile.name || 'wall').replace(/\.[^.]+$/, '') + '.jpg';
    const f = new File([blob], name, { type: 'image/jpeg' });
    closeCrop();
    if (cropUrl) { URL.revokeObjectURL(cropUrl); cropUrl = null; }
    xhrUpload('api/wallpapers', f, {}, () => { toast('背景已上传并已切换'); refresh(); });
  }, 'image/jpeg', 0.9);
});

// 弹窗外点击 = 关闭
['crop', 'edit', 'import'].forEach(id => $('#' + id).addEventListener('click', e => {
  if (e.target === e.currentTarget) ({ crop: closeCrop, edit: closeEdit, import: closeImport })[id]();
}));

// 视口变化（转屏/键盘弹出）重算框
window.addEventListener('resize', () => {
  if ($('#crop').classList.contains('on') && $('#crop-img').naturalWidth) {
    layoutCrop(); clampCrop(); applyCrop();
  }
});

// ── 上传入口 ────────────────────────────────────────────

$('#wall-file').addEventListener('change', e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  if (f.size > 20 * 1024 * 1024) { toast('图片超过 20MB 限制，已取消上传', true); return; } // 与服务端限额一致，先拦后传
  openCrop(f); // 选图后先进裁剪编辑，确认后才上传
});

$('#track-file').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f && f.size > 100 * 1024 * 1024) toast('音频超过 100MB 限制，已取消上传', true); // 与服务端限额一致，先拦后传
  else if (f) xhrUpload('api/tracks', f, {
    title: f.name.replace(/\.[^.]+$/, ''),
    sub: 'MY MUSIC · 自定义',
  }, () => { toast('音频已上传'); refresh(); });
  e.target.value = '';
});

refresh();
// 轮询：页面隐藏跳过请求；上一次刷新/轮询未完成跳过本轮；state 与上次一致跳过重绘（避免整表重建吞手势）
setInterval(async () => {
  if (document.hidden || refreshing || polling) return;
  polling = true;
  try {
    const s = await api('api/state');
    const sig = JSON.stringify(s);
    if (sig === lastStateJson) return; // 与上次相同：跳过重绘
    lastStateJson = sig;
    state = s; renderNow(); renderTracks();
  } catch (e) {} finally { polling = false; }
}, 5000);
